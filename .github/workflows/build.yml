name: Build Aseprite

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Aseprite branch, tag, or commit"
        required: true
        default: "main"

      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
        default: Release

      scripting:
        description: "Enable Lua scripting"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # ========================================
      # 获取 Aseprite
      # ========================================
      - name: Checkout Aseprite
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 1

      # ========================================
      # Ninja
      # ========================================
      - name: Install Ninja
        uses: aseprite/get-ninja@main

      # ========================================
      # Visual Studio MSVC
      # ========================================
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # ========================================
      # 下载当前 Aseprite 对应的 Skia
      # ========================================
      - name: Install Skia
        shell: bash
        run: |
          echo "Getting Skia URL..."

          skia_url=$(source "$GITHUB_WORKSPACE/laf/misc/skia-url.sh" | xargs)

          echo "Skia URL:"
          echo "$skia_url"

          skia_file=$(basename "$skia_url")

          echo "Downloading $skia_file..."

          curl \
            --ssl-revoke-best-effort \
            -L \
            -o "$skia_file" \
            "$skia_url"

          echo "Extracting Skia..."

          unzip "$skia_file" -d skia

          echo "Skia contents:"
          ls -la skia
          ls -la skia/out/Release-x64

      # ========================================
      # CMake
      # ========================================
      - name: Configure CMake
        shell: bash
        run: |
          if [[ "${{ inputs.scripting }}" == "true" ]]; then
            enable_scripting=on
          else
            enable_scripting=off
          fi

          echo "Build type: ${{ inputs.build_type }}"
          echo "Scripting: $enable_scripting"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING="$enable_scripting" \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

      # ========================================
      # 编译
      # ========================================
      - name: Build
        shell: bash
        run: |
          cd build
          ninja aseprite

      # ========================================
      # 检查
      # ========================================
      - name: Check output
        shell: bash
        run: |
          echo "===== Build output ====="
          ls -lah build/bin

          echo ""
          echo "===== Aseprite ====="
          ls -lh build/bin/aseprite.exe

      # ========================================
      # 打包
      # ========================================
      - name: Package
        shell: powershell
        run: |
          $ref = "${{ inputs.ref }}"
          $sha = "${{ github.sha }}".Substring(0, 8)

          if ([string]::IsNullOrWhiteSpace($ref)) {
              $ref = "main"
          }

          $safeRef = $ref -replace '[\\/:*?"<>|]', '-'

          $packageName = "Aseprite-Windows-x64-$safeRef-$sha"

          New-Item `
            -ItemType Directory `
            -Path package `
            -Force | Out-Null

          Copy-Item `
            -Path "build/bin/*" `
            -Destination "package" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "package/*" `
            -DestinationPath "$packageName.zip" `
            -Force

          Write-Host "Created:"
          Write-Host "$packageName.zip"

      # ========================================
      # 上传 Artifact
      # ========================================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Windows-x64-*.zip
          if-no-files-found: error
          retention-days: 7
